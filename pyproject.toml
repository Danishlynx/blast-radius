[project]
name = "blast-radius"
version = "0.1.0"
description = "Autonomous ML supply-chain guardian agent on the DataHub metadata graph"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "acryl-datahub[dbt,mlflow]==1.6.0.17",
    "dbt-duckdb==1.10.1",
    "duckdb>=1.0",
    # acryl-datahub's mlflow connector caps mlflow-skinny at <2.21, so the
    # whole stack (client + server image in docker-compose.yml) runs 2.20.x.
    "mlflow==2.20.3",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "rich>=13.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pydantic>=2.5",
    "anthropic>=0.40",
    "mcp>=1.2",
]

[project.scripts]
blast-radius = "agent.cli:main"

[dependency-groups]
dev = [
    "mcp-server-datahub==0.6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM115",  # mcp_read keeps devnull open for the session lifetime via ExitStack
]

[tool.pytest.ini_options]
testpaths = ["tests"]
